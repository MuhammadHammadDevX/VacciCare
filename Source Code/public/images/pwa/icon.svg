<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle / Shield Base -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <!-- Shield Shape -->
  <path d="M256 80 L390 140 C390 280 256 390 256 420 C256 390 122 280 122 140 Z" fill="#ffffff" opacity="0.15" />

  <!-- Inner Medical Cross / Plus -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="226" y="156" width="60" height="200" rx="18" />
    <!-- Horizontal Bar -->
    <rect x="156" y="226" width="200" height="60" rx="18" />
  </g>

  <!-- Vaccination Syringe Sparkle / Heart Emblem in Center -->
  <circle cx="256" cy="256" r="28" fill="#0284c7" />
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
</svg>
